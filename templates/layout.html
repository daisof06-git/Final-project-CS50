<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!--bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <!--css-->
        <link href="/static/styles.css" rel="stylesheet">

        <title>BudgetJars: {% block title %}{% endblock %}</title>
    </head>
    <body>
        <nav class="navbar navbar-expand-md navbar-light bg-light">
            <div class = "container-fluid">
                <a class="navbar-brand" href="/">Jars</a>
            </div>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbar">
                {% if session["user_id"] %}
                    <ul class="navbar-nav ms-auto mt-2">
                        <a class="nav-item nav-link active" href="/"> Home <span class="sr-only">(current)
                        </span></a>
                        <a class="nav-item nav-link" href="/budget">Budget</a>
                        <a class="nav-item nav-link" href="/income">Add Income</a>
                        <a class="nav-item nav-link" href="/jars">Jars</a>
                        <a class="nav-item nav-link" href="/stats">Stats</a>
                        <a class="nav-item nav-link" href="/settings">Settings</a>
                    </ul>
                    <ul class="navbar-nav ms-auto mt-2">
                        <a class="nav-item nav-link" href="/logout">Logout</a>
                    </ul>
                {% else %}
                    <ul class="navbar-nav ms-auto mt-2">
                        <a class="nav-item nav-link" href="/login">Login</a>
                        <a class="nav-item nav-link" href="/register">Register</a>
                    </ul>
                {% endif %}
            </div>
        </nav>
        {% if error %}
            <header>
                <div class="alert alert-primary mb-0 text-center" role="alert">
                    {{ error }}
                </div>
            </header>
        {% endif %}

        <main class="container py-5 text-center">
            {% block main %}{% endblock %}
        </main>
    </body>
</html>
